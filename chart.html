function gcd(a, b) { return b ? gcd(b, a % b) : a; }

function formatFraction(num, den) {
    if (num === 0) return "0";
    if (num === den) return "1";
    let common = gcd(num, den);
    num /= common;
    den /= common;
    return `${num}/${den}`;
}

function populateTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    fractionData.forEach((item) => {
        const row = document.createElement('tr');
        row.id = `row-${item.num}-${item.den}`;
        
        if (item.type === 'metric') {
            row.classList.add('metric-row');
            row.innerHTML = `
                <td class="metric-value">${item.label}</td>
                <td class="decimal">${item.decimal.toFixed(5).replace(/0+$/, '').replace(/\.$/, '')}</td>
                <td class="metric-value">${item.mm}</td>
            `;
        } else {
            row.innerHTML = `
                <td class="fraction">${formatFraction(item.num, item.den)}</td>
                <td class="decimal">${item.decimal.toFixed(6).replace(/0+$/, '').replace(/\.$/, '') || '0'}</td>
                <td>${item.mm.toFixed(3)}</td>
            `;
        }
        tbody.appendChild(row);
    });
}

function searchTable() {
    const searchValue = parseFloat(document.getElementById('searchInput').value);
    
    // Remove previous highlights
    document.querySelectorAll('tr.highlight').forEach(row => row.classList.remove('highlight'));
    
    if (isNaN(searchValue)) return;
    
    // Find closest match by comparing decimal values
    let closestIndex = 0;
    let closestDiff = Infinity;
    
    fractionData.forEach((item, index) => {
        const diff = Math.abs(item.decimal - searchValue);
        if (diff < closestDiff) {
            closestDiff = diff;
            closestIndex = index;
        }
    });
    
    const closestItem = fractionData[closestIndex];
    const closestRow = document.getElementById(`row-${closestItem.num}-${closestItem.den}`);
    
    if (closestRow) {
        closestRow.classList.add('highlight');
        closestRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function autoScrollToValue(decimalValue) {
    if (isNaN(decimalValue)) return;
    
    document.getElementById('searchInput').value = decimalValue.toFixed(4);
    searchTable();
}

// Populate table on page load
document.addEventListener('DOMContentLoaded', populateTable);

// Check for auto-scroll parameter
const params = new URLSearchParams(window.location.search);
if (params.has('value')) {
    const value = parseFloat(params.get('value'));
    setTimeout(() => autoScrollToValue(value), 100);
}
