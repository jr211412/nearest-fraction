<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Convert decimals to fractions and metric measurements with instant calculations">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Frac↔Metric">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <title>Fraction & Metric Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            background: #f4f7f6;
            min-height: 100vh;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 380px;
        }
        h2 { 
            margin: 0 0 20px 0; 
            color: #2c3e50; 
            font-size: 1.4rem; 
            text-align: center; 
        }
        .input-group { 
            margin-bottom: 18px; 
        }
        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #7f8c8d; 
            margin-bottom: 8px; 
            font-weight: 600; 
        }
        input, select { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #dfe6e9; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            outline: none; 
            transition: border-color 0.2s;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        input:focus, select:focus { 
            border-color: #3498db; 
        }
        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 40px;
        }
        .result-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: 20px; 
        }
        .result-box { 
            background: #ebf5fb; 
            padding: 18px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #d6eaf8;
        }
        .result-box.metric { 
            background: #f0fdf4; 
            border-color: #dcfce7; 
        }
        .fraction { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: #2980b9; 
            margin-top: 8px;
            word-break: break-word;
        }
        .mm-val { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: #16a34a; 
            margin-top: 8px;
        }
        .unit { 
            font-size: 0.9rem; 
            font-weight: 400; 
            color: #666; 
        }
        .result-box.warn { 
            background: #fff1f2; 
            border-color: #fecaca; 
        }
        .result-box.warn .fraction { 
            color: #dc2626; 
        }
        .chart-link { 
            display: block; 
            text-align: center; 
            margin-top: 22px; 
        }
        .chart-link a { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px; 
            background: #27ae60; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: background 0.2s;
            min-height: 44px;
            min-width: 44px;
            font-size: 1rem;
        }
        .chart-link a:active { 
            background: #229954; 
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
            }
            .card {
                padding: 18px;
                border-radius: 12px;
            }
            h2 {
                font-size: 1.2rem;
                margin-bottom: 16px;
            }
            .input-group {
                margin-bottom: 14px;
            }
            input, select {
                padding: 12px;
                font-size: 16px;
            }
            .result-box {
                padding: 14px;
            }
            .result-container {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Fraction & Metric</h2>
	
	<div class="input-group">
		<label>Decimal Inches</label>
		<input type="number" id="inchInput" step="any" placeholder="e.g. 0.625" oninput="syncFromInches()">
	</div>

	<div class="input-group">
		<label>Millimeters</label>
		<input type="number" id="mmInput" step="any" placeholder="e.g. 15.875" oninput="syncFromMM()">
	</div>
	
	<div class="input-group">
		<label>Tolerance Threshold (inches)</label>
		<input type="number" id="tolLimit" step="0.0001" value="0.010" oninput="updateAll()">
	</div>

    <div class="input-group">
        <label>Round Fraction to...</label>
        <select id="denomSelect" onchange="updateAll()">
            <option value="2">1/2</option>
            <option value="4">1/4</option>
            <option value="8">1/8</option>
            <option value="16" selected>1/16</option>
            <option value="32">1/32</option>
            <option value="64">1/64</option>
            <option value="custom">Custom</option>
        </select>
    </div>

    <div id="customGroup" class="input-group" style="display:none;">
        <label>Custom Denominator</label>
        <input type="number" id="customDenom" value="10" oninput="updateAll()">
    </div>
	
    <div class="result-container">
		<div class="result-box">
			<label>Rounded Fraction</label>
			<div id="output" class="fraction">0</div>
		</div>
		
		<div class="result-box">
			<label>Tolerance</label>
			<div id="tolerance" class="fraction">±0.0000"</div>
		</div>
	</div>

	<div class="chart-link">
		<a href="#" onclick="openChart(); return false;">📊 View Chart</a>
	</div>

</div>

<script>
function gcd(a, b) { return b ? gcd(b, a % b) : a; }

let activeField = null;

function syncFromInches() {
    if (activeField === "mm") return;
    activeField = "inch";

    let inches = parseFloat(document.getElementById('inchInput').value);
    if (isNaN(inches)) {
        document.getElementById('mmInput').value = "";
        convert(inches);
        activeField = null;
        return;
    }

    document.getElementById('mmInput').value = (inches * 25.4).toFixed(3);
    convert(inches);
    activeField = null;
}

function syncFromMM() {
    if (activeField === "inch") return;
    activeField = "mm";

    let mm = parseFloat(document.getElementById('mmInput').value);
    if (isNaN(mm)) {
        document.getElementById('inchInput').value = "";
        convert(NaN);
        activeField = null;
        return;
    }

    let inches = mm / 25.4;
    document.getElementById('inchInput').value = inches.toFixed(4);
    convert(inches);
    activeField = null;
}

function updateAll() {
    const select = document.getElementById('denomSelect');
    const customGroup = document.getElementById('customGroup');
    customGroup.style.display = select.value === 'custom' ? 'block' : 'none';
    
    let inches = parseFloat(document.getElementById('inchInput').value);
    if (!isNaN(inches)) {
        convert(inches);
    }
}

function decimalToTrueFraction(x) {
    const precision = 1000000;
    let numerator = Math.round(x * precision);
    let denominator = precision;
    let common = gcd(numerator, denominator);
    return {
        num: numerator / common,
        den: denominator / common
    };
}

function bestFraction(x, maxDen = 64) {
    let bestNum = 0;
    let bestDen = 1;
    let bestErr = Infinity;

    for (let den = 1; den <= maxDen; den++) {
        let num = Math.round(x * den);
        let err = Math.abs(x - num / den);

        if (err < bestErr) {
            bestErr = err;
            bestNum = num;
            bestDen = den;
        }
    }

    let common = gcd(bestNum, bestDen);
    return {
        num: bestNum / common,
        den: bestDen / common
    };
}

function convert(inches) {
    let denomChoice = document.getElementById('denomSelect').value;
    let tolLimit = parseFloat(document.getElementById('tolLimit').value);

    let targetDenom = denomChoice === 'custom'
        ? parseInt(document.getElementById('customDenom').value)
        : parseInt(denomChoice);

    const tolBox = document.getElementById('tolerance').parentElement;
    tolBox.classList.remove("warn");

    if (isNaN(inches)) {
        document.getElementById('output').innerHTML = "0";
        document.getElementById('tolerance').innerHTML = "±0.0000\"";
        return;
    }

    // ---- Rounded fraction ----
    let whole = Math.floor(Math.abs(inches));
    let decimal = Math.abs(inches) - whole;
    let sign = inches < 0 ? "-" : "";

    let numerator = Math.round(decimal * targetDenom);
    let roundedInches = whole;

    if (numerator === targetDenom) {
        roundedInches = whole + 1;
        document.getElementById('output').innerHTML = sign + roundedInches;
    } else if (numerator === 0) {
        document.getElementById('output').innerHTML =
            whole === 0 ? "0" : sign + whole;
    } else {
        let common = gcd(numerator, targetDenom);
        let fn = numerator / common;
        let fd = targetDenom / common;

        roundedInches = whole + fn / fd;
        let displayWhole = whole > 0 ? whole + " " : "";
        document.getElementById('output').innerHTML =
            sign + displayWhole + fn + "/" + fd;
    }

    // ---- Tolerance ----
    let tol = Math.abs(inches - roundedInches);
    document.getElementById('tolerance').innerHTML =
        "±" + tol.toFixed(4) + "\"";

    if (!isNaN(tolLimit) && tol > tolLimit) {
        tolBox.classList.add("warn");
    }
}

function openChart() {
    let inches = parseFloat(document.getElementById('inchInput').value);
    if (isNaN(inches)) {
        window.location.href = 'chart.html';
    } else {
        window.location.href = 'chart.html?value=' + inches;
    }
}

// Register service worker for offline support
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('Service Worker registration failed:', err);
    });
}
</script>

</body>
</html>
